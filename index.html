const IT=250000;
const CHAS=8, LSK='pult_kluch', LSD='pult_kluch_do', LSP='pult_pomnit';
const f=document.getElementById('f'),pi=document.getElementById('p'),bt=document.getElementById('b'),
      er=document.getElementById('e'),rm=document.getElementById('r');
const u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const b64=b=>btoa(String.fromCharCode.apply(null,new Uint8Array(b)));
try{rm.checked=localStorage.getItem(LSP)==='1'}catch(x){}
function zabyt(){try{localStorage.removeItem(LSK);localStorage.removeItem(LSD)}catch(x){}}
async function otkryt(k){
 const out=await crypto.subtle.decrypt({name:'AES-GCM',iv:V},k,B);
 const html=new TextDecoder().decode(out);
 document.open();document.write(html);document.close()}
async function klyuchIzParolya(pw){
 const enc=new TextEncoder();
 const km=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
 return crypto.subtle.deriveKey({name:'PBKDF2',salt:S,iterations:IT,hash:'SHA-256'},km,
   {name:'AES-GCM',length:256},true,['decrypt'])}
// запомненный вход: хранится ключ и срок, оба только в этом браузере
async function popytkaBezParolya(){
 try{
  const zap=localStorage.getItem(LSK), srok=+localStorage.getItem(LSD)||0;
  if(!zap||Date.now()>srok){zabyt();return false}
  const k=await crypto.subtle.importKey('raw',u8(zap),{name:'AES-GCM'},true,['decrypt']);
  await otkryt(k); return true
 }catch(x){zabyt(); return false}}
f.addEventListener('submit',async ev=>{ev.preventDefault();
 er.textContent='';bt.disabled=true;bt.textContent='Расшифровываю…';
 try{
  const k=await klyuchIzParolya(pi.value);
  await crypto.subtle.decrypt({name:'AES-GCM',iv:V},k,B);   // проверяем пароль
  try{
   localStorage.setItem(LSP,rm.checked?'1':'0');
   if(rm.checked){
    const raw=await crypto.subtle.exportKey('raw',k);
    localStorage.setItem(LSK,b64(raw));
    localStorage.setItem(LSD,String(Date.now()+CHAS*3600*1000));
   } else zabyt();
  }catch(x){}
  await otkryt(k);
 }catch(x){er.textContent='Неверный пароль';bt.disabled=false;bt.textContent='Открыть';pi.select()}
});
if(!(crypto&&crypto.subtle))er.textContent='Браузер слишком старый. Откройте в Chrome или Safari.';
else popytkaBezParolya();
